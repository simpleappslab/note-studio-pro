<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; worker-src 'self'; font-src 'self' data:; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"><title>AllNote PDF Studio</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="pdf-studio.css"><script defer src="vendor/pdf-lib.min.js"></script><script defer src="pdf-studio-core.js"></script><script type="module" src="pdf-studio.mjs"></script></head><body><main id="pdf-app"><header><a href="index.html">← Notes</a><strong>PDF Studio</strong><span>Local processing · no uploads</span><button id="theme">Theme</button></header><nav aria-label="PDF tools"><button id="open">Open PDF</button><button id="merge">Merge</button><button id="images">Images to PDF</button><button data-op="extract">Extract / reorder</button><button data-op="split">Split pages</button><button data-op="rotate">Rotate</button><button data-op="remove">Delete pages</button><button data-op="text">Add text</button><button data-op="watermark">Watermark</button><button data-op="image">Add image / signature</button><button data-op="shape">Add rectangle</button><button data-op="png">Export PNG</button><button data-op="jpg">Export JPG</button><button data-op="txt">Export text</button><button data-op="compress">Compress (raster)</button><button data-op="undo">Undo</button><button data-op="redo">Redo</button><button data-op="save">Save as</button></nav><div class="pdf-body"><aside><strong>Pages</strong><div id="pages"></div></aside><section class="pdf-view"><div class="pdf-controls"><button id="prev">Previous</button><output id="position">No PDF</output><button id="next">Next</button><label>Zoom <select id="zoom"><option value=".75">75%</option><option value="1" selected>100%</option><option value="1.5">150%</option><option value="2">200%</option></select></label><label>Find <input id="search" type="search" maxlength="200"></label><button id="find">Find next</button></div><div id="paper"><p id="empty">Open a PDF to begin. Files remain on this device.</p><canvas id="canvas" hidden></canvas></div></section><aside class="pdf-options"><strong>Page operations</strong><label>Pages (e.g. 1,3-5)<input id="range" value="1"></label><label>Text / watermark<input id="annotation" maxlength="500"></label><label>X (points)<input id="x" type="number" value="36" min="0"></label><label>Y (points from bottom)<input id="y" type="number" value="36" min="0"></label><label>Size<input id="size" type="number" value="18" min="6" max="144"></label><label>Raster quality<select id="quality"><option value=".65">Small</option><option value=".85" selected>Balanced</option><option value=".95">High</option></select></label><p>Raster compression removes searchable text, links and forms. Text and image edits are overlays, not redaction.</p></aside></div><footer id="status" role="status" aria-live="polite">Ready</footer><input id="files" type="file" hidden accept="application/pdf,.pdf" multiple><input id="image-files" type="file" hidden accept="image/png,image/jpeg" multiple></main></body></html>
