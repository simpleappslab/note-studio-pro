name: Native mobile builds
on:
  pull_request:
    branches: [main]
    paths: ['mobile/**', 'android/**', 'ios/**', 'dist/**', 'scripts/build-mobile.mjs', 'scripts/check-native-files.cjs', 'package*.json', 'capacitor.config.json', '.github/workflows/mobile.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci --ignore-scripts
      - run: npm run build:mobile && npx --no-install cap sync android
      - run: node --test scripts/check-native-files.cjs
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v7
        with:
          name: allnote-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: cd android && ./gradlew connectedDebugAndroidTest --no-daemon

  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:mobile && npx --no-install cap sync ios
      - name: Build iOS simulator app
        run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/allnote-ios"
          CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator app
        run: |
          ditto -c -k --keepParent "$RUNNER_TEMP/allnote-ios/Build/Products/Debug-iphonesimulator/App.app" "$RUNNER_TEMP/AllNote-iOS-Simulator.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: allnote-ios-simulator
          path: ${{ runner.temp }}/AllNote-iOS-Simulator.zip
          if-no-files-found: error
