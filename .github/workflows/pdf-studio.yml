name: PDF Studio validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/pdf-studio]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --package-lock=false --ignore-scripts pdf-lib@1.17.1 pdfjs-dist@6.5.438
      - run: node scripts/vendor-pdf.mjs
      - run: node --check dist/pdf-studio.mjs && node --check dist/pdf-studio-core.js
      - run: npm run check
      - run: npm test
      - run: node --test scripts/check-pdf-studio.cjs
      - run: npm audit --audit-level=high
      - run: npm run build:pwa

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: allnote-pdf-preview
          path: dist/
