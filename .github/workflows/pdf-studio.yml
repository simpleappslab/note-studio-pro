name: PDF Studio validation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pdf-studio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: python -m pip install --disable-pip-version-check Pillow==13.0.0
      - name: Verify reproducible web and PWA assets
        run: |
          npm run build:pwa
          git diff --exit-code -- dist
      - run: npm run check
      - run: npm test
      - name: Audit all locked npm dependencies
        run: npm audit --audit-level=info --json | tee "$RUNNER_TEMP/npm-audit.json"
        shell: bash
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          ALLNOTE_SCREENSHOTS: ${{ runner.temp }}/allnote-preview/screenshots
      - name: Package web, PWA and Chrome extension preview
        run: |
          npm run package:web -- "$RUNNER_TEMP/allnote-preview/web"
          python scripts/build-extension.py --output "$RUNNER_TEMP/allnote-extension/allnote-chrome-preview.zip"
          cp "$RUNNER_TEMP/allnote-extension/allnote-chrome-preview.zip" "$RUNNER_TEMP/allnote-preview/"
          cp "$RUNNER_TEMP/npm-audit.json" PDF-STUDIO-SECURITY.md PDF-STUDIO-PHASE3.md "$RUNNER_TEMP/allnote-preview/"
      - name: Upload preview packages and screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: allnote-pdf-preview
          path: ${{ runner.temp }}/allnote-preview/
          if-no-files-found: error
      - name: Upload browser report
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: allnote-browser-report
          path: playwright-report/
