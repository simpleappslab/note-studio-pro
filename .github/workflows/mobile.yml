name: Native mobile builds
on:
  pull_request:
    branches: [main]
    paths: ['mobile/**', 'android/**', 'ios/**', 'dist/**', 'scripts/build-mobile.mjs', 'scripts/check-native-files.cjs', 'package*.json', 'capacitor.config.json', '.github/workflows/mobile.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci --ignore-scripts
      - run: npm run build:mobile && npx --no-install cap sync android
      - run: node --test scripts/check-native-files.cjs
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v7
        with:
          name: allnote-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: cd android && ./gradlew connectedDebugAndroidTest --no-daemon

  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:mobile && npx --no-install cap sync ios
      - name: Build iOS simulator app
        run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/allnote-ios"
          CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator app
        run: |
          ditto -c -k --keepParent "$RUNNER_TEMP/allnote-ios/Build/Products/Debug-iphonesimulator/App.app" "$RUNNER_TEMP/AllNote-iOS-Simulator.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: allnote-ios-simulator
          path: ${{ runner.temp }}/AllNote-iOS-Simulator.zip
          if-no-files-found: error
      - name: Launch and smoke-test the bundled editor
        run: |
          device="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if d["name"].startswith("iPhone")))')"
          xcrun simctl boot "$device" || xcrun simctl list devices booted | grep -F "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" "$RUNNER_TEMP/allnote-ios/Build/Products/Debug-iphonesimulator/App.app"
          xcrun simctl launch "$device" com.simpleappslab.allnotepdf --allnote-smoke
          container="$(xcrun simctl get_app_container "$device" com.simpleappslab.allnotepdf data)"
          for attempt in $(seq 1 50); do
            if test -f "$container/Library/Caches/allnote-smoke.txt"; then break; fi
            sleep 2
          done
          cat "$container/Library/Caches/allnote-smoke.txt"
          grep -q '^PASS:' "$container/Library/Caches/allnote-smoke.txt"
          xcrun simctl io "$device" screenshot "$RUNNER_TEMP/allnote-ios-screen.png"
      - uses: actions/upload-artifact@v7
        with:
          name: allnote-ios-screenshot
          path: ${{ runner.temp }}/allnote-ios-screen.png
