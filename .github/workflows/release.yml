name: Create GitHub release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag matching package.json version
        required: true
        default: v1.8.0
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build:pwa
      - run: npm run check
      - run: npm test
      - run: npm run package:web
      - name: Publish release
        run: node scripts/publish-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOTE_STUDIO_RELEASE_TAG: ${{ inputs.tag }}
          NOTE_STUDIO_RELEASE_COMMIT: ${{ github.sha }}
